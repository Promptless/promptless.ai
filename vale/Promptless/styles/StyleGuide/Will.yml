# Rung: Stated, unconditional. Source: $KB_REPO/style/client_style_guide.md,
# "Avoid 'will'" (Voice and Tense).
# Level: warning, not the rung's default error. The repo's CI (vale.yml) fails
# the whole build on any error-level finding across src/content/docs, and this
# rule fires on 17 pages of pre-existing prose. Warning surfaces it in local
# Vale and review annotations without failing CI on legacy prose; matches the
# other corpus-firing stated rules here (PastState, GithubPrProse). The
# error-level enforcement resumes once the legacy "will" prose is cleaned up.
extends: existence
message: "Avoid 'will' to describe product behavior; use present tense (e.g., 'Promptless analyzes the thread', not 'Promptless will analyze the thread')."
level: warning
ignorecase: true
tokens:
  - will
