# Source: the Promptless style guide, "Describe what is, not what it isn't or
# used to be". Applies when the phrase frames current behavior against
# something the product doesn't do or once did. The phrases have other uses
# ("you no longer need the token", a quoted UI label), so this stays a warning.
extends: existence
message: "'%s' frames the behavior against an alternative or a past state. Describe the current behavior positively."
level: warning
ignorecase: true
tokens:
  - rather than
  - instead of
  - there's no
  - there is no
  - previously
  - used to
  - was removed
  - no longer
