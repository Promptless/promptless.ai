# Source: Manny (@hawkeyexl), Promptless/promptless.ai suggestion review,
# 2026-10-30: "Add a Vale rule that disallows semi-colons."
#
# Vale skips code spans and code blocks. The lookbehind skips a semicolon that
# follows a quote, which keeps MDX `import ... from '...';` lines out.
#
# Level is warning, not error: the rule fires on existing src/content/docs
# pages, and the vale workflow fails on any error. Raise it to error once
# those pages are clean.
extends: existence
message: "Don't use semicolons. Split the sentence in two, or use a comma or a list."
level: warning
nonword: true
tokens:
  - "(?<!['\"]);"
