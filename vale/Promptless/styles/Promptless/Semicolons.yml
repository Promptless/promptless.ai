# Rung: Stated, unconditional. Source: Manny (@hawkeyexl), Promptless/promptless.ai
# suggestion review on promptless/claude-chatgpt-page-restructure, 2026-10-30
# (thread 0db2f7a9), "Add a Vale rule that disallows semi-colons. I'm sick of
# them."
#
# Split the sentence in two, or use a comma or a list instead. Vale skips code
# spans and code blocks, so semicolons in commands and code samples are not
# flagged. The lookbehind skips a semicolon that follows a quote, which keeps
# MDX `import ... from '...';` lines out of the count.
#
# Level is warning for now, not error: on 2026-10-30 the rule fired 114 times
# across 33 src/content/docs pages, and the vale workflow fails on any error
# across the whole tree. Raise it to error once those pages are cleaned up.
extends: existence
message: "Don't use semicolons. Split the sentence in two, or use a comma or a list."
level: warning
nonword: true
tokens:
  - "(?<!['\"]);"
