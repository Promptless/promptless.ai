# Rung: Stated, unconditional. Source: Manny (@hawkeyexl), Promptless/promptless.ai
# PR #967 review, 2026-09-11 (thread 0a0ee17e), "'wire it up' is too informal.
# Just got with set it up. And make a vale rule to catch this in the future."
#
# "wire it up" and its phrasal-verb siblings ("wire those tools in", "wires the
# queries through") read as informal in product prose. Use "set up" or
# "connect" instead. This is a house banned-informal-term ban, so it runs as an
# existence check alongside WorkedExample and ReplyObligation.
#
# Level is error, matching the sibling term bans: the pattern is verified to
# fire on zero of the 103 in-scope src/content/docs pages (the two corpus uses
# of "wire" — "cross-wiring your teams" and "the chart wires the ... key into
# the worker" — carry no up/in/through particle and are not matched), so it
# clears the collection's "error is reserved for banned terms already clean
# against the corpus" calibration. The tokens match only the informal
# phrasal-verb constructions ("wire"/"wires"/"wired"/"wiring" followed, within a
# few words, by "up", "in", or "through"), so a legitimate noun "wire" or a
# "wires X into Y" system statement is left alone. Go's RE2 engine has no
# lookbehind, so the particle requirement — not a lookbehind — is what keeps the
# compound "cross-wiring" from matching.
extends: existence
message: "'%s' is too informal; use 'set up' or 'connect' instead."
level: error
ignorecase: true
tokens:
  - '\bwir(e|es|ed|ing)\s+(\w+\s+){0,3}up\b'
  - '\bwir(e|es|ed|ing)\s+(\w+\s+){1,3}(in|through)\b'
