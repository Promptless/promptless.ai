# "Shape" as a stand-in for "format" is vague, and the docs already name the
# format. The swap has one right answer, so it runs as a substitution. It
# matches only the noun phrases, which leaves the verb ("shape your
# instructions") and the idiom "the same shape" alone.
extends: substitution
message: "Vague noun: use '%s' instead of '%s'."
level: error
ignorecase: true
capitalize: true
action:
  name: replace
swap:
  message shapes: message formats
  message shape: message format
  notification shapes: notification formats
  notification shape: notification format
  default shapes: default formats
  default shape: default format
