# Rung: Stated, unconditional. Source: Manny (@hawkeyexl), Promptless/promptless.ai
# PR #985 review, 2026-09-15 (thread eff242e3), '"shape" is an AI tell. Write a
# Vale rule for a substitution and remove it from the docs where the rule
# finds errors.'
#
# "shape" used as a vague stand-in for "format" ("message shape", "default
# shape") reads as an AI-generated abstraction — this collection already
# names the concrete term ("message format", "Define a message format") and
# the vaguer synonym adds nothing. This is a lexical preference with a single
# right answer, so it runs as a substitution that swaps the flagged phrase for
# its plainer, already-established form, alongside the sibling house term-ban
# WorkedExample.
#
# The tokens match only the noun-phrase collocations actually used as an
# AI-vague synonym for "format" ("message shape(s)", "notification shape(s)",
# "default shape(s)"). The bare word "shape" is not banned: it is left alone
# as a verb ("shape your instructions"), in the structural idiom "(the) same
# shape", in the compound "shape-checked", and in unrelated senses ("product
# shape", "request shapes"), none of which this rule matches.
#
# Level is error, matching the sibling term bans (WorkedExample,
# ReplyObligation, WireUp): the pattern is verified to fire on zero of the
# 136 in-scope src/content/docs + src/content/changelog pages once this same
# PR's own prose fix (notifications.mdx:86, notifications.mdx:126,
# september-2026.mdx:22 — the only three corpus occurrences of the banned
# collocations) lands, so it clears the collection's "error is reserved for
# banned terms already clean against the corpus" calibration.
extends: substitution
message: "'%s' is an AI tell here; use '%s' instead."
level: error
ignorecase: true
action:
  name: replace
swap:
  message shapes: message formats
  message shape: message format
  notification shapes: notification formats
  notification shape: notification format
  default shapes: default formats
  default shape: default format
