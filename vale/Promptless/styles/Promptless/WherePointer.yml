# Source: the Promptless style guide, "Keep UI instructions lean": don't add
# "for where X appears, see ..." pointers.
extends: existence
message: "Don't add a '%s' pointer. Describe the action and its outcome."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bfor where\b[^.\n]{1,80}?\b(?:appears?|lives|sits|shows)\b[^.\n]{0,20}?\bsee\b'
