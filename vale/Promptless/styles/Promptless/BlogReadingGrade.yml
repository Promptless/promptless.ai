# Source: the Promptless blog style guide, "Reading level: 10th grade". The
# guide names no formula, so this uses Flesch-Kincaid grade.
#
# For blog articles only. A consumer turns it off for every other path and on
# for its blog. The docs site turns it off in its root .vale.ini and does not
# lint its blog with Vale.
extends: readability
message: "This blog article reads above a 10th-grade level (Flesch-Kincaid). Use shorter sentences and plainer words."
level: warning
metrics:
  - Flesch-Kincaid
grade: 10
