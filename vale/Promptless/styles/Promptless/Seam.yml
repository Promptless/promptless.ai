# Rung: Stated, unconditional. Source: Manny (@hawkeyexl), Promptless/promptless.ai
# PR #967 review, 2026-09-11 (thread 8a74a787), '"seam" is an ai smell. Write a
# Vale rule against it.'
#
# "seam" (and "seams") reads as an AI-generated abstraction in product prose —
# it is used to mean a connection, hook, or integration point but rarely says
# so plainly. Use a concrete word instead: "hook", "integration point",
# "connection", or name the mechanism directly. This is a house
# banned-AI-smell-term ban, so it runs as an existence check alongside WireUp,
# WorkedExample, and ReplyObligation.
#
# Level is error, matching the sibling term bans: the pattern is verified to
# fire on zero of the in-scope src/content/docs pages once PR #967's own prose
# fixes land (the four Starport-analytics uses of "seam" are removed in the same
# PR that adds this rule, and "seam" appears nowhere else in the 111-page
# corpus), so it clears the collection's "error is reserved for banned terms
# already clean against the corpus" calibration.
extends: existence
message: "'%s' is an AI smell; use a concrete word like 'hook', 'integration point', or 'connection'."
level: error
ignorecase: true
tokens:
  - '\bseams?\b'
