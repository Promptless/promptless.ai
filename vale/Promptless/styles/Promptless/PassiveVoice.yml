# Source: the Promptless style guide, "Active voice" (a preference, so warning).
# Inherits the pattern and participle list from Std.Grammar.PassiveVoice, which
# ships in this package. The pattern matches any "be" form before a participle,
# so it also flags adjectives ("is required", "is connected"). The docs site
# turns this rule off in its root .vale.ini for that reason.
extends: Std.Grammar.PassiveVoice
message: "'%s' looks like passive voice. Prefer active voice: 'Promptless considers only matching PRs', not 'only matching PRs will be considered'."
level: warning
