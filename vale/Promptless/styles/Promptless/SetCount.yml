# Source: the Promptless style guide, "Don't enumerate sets that change": no
# counts such as "these 14 tools", "six more tools", "two skills ship today".
# Covers the sets the guide names: tools, integrations, API endpoints and
# operations, and skills.
extends: existence
message: "'%s' counts a set the product extends. Describe the set by what it does and link to the reference page."
level: error
ignorecase: true
tokens:
  - '(?:\d+|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty)\s+(?:more\s+|other\s+|new\s+)?(?:MCP\s+|API\s+)?(?:tools|integrations|endpoints|skills|operations)'
