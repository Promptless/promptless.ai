# Source: the Promptless style guide, "Avoid 'will'". Describe product behavior
# in the present tense. The token matches every "will", so a "will" that is
# not about product behavior ("you will need admin access") is flagged too and
# takes the same present-tense rewrite.
extends: existence
message: "Don't use 'will' to describe product behavior. Use present tense: 'Promptless analyzes the thread', not 'Promptless will analyze the thread'."
level: error
ignorecase: true
tokens:
  - will
