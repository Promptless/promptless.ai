# Sources: the Promptless style guide ("Do not contrast a feature with a
# hypothetical alternative") and the blog style guide ("X is not Y, but Z"
# constructions). Inherits the pattern from Voices.BinaryContrast, which ships
# in this package, and replaces it: enable one of the two, not both. The level
# is error, the same as Voices.BinaryContrast, so switching to this rule does
# not weaken a check.
extends: Voices.BinaryContrast
message: "'%s' sets up what it isn't. State what it is directly."
level: error
