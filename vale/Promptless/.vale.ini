# Promptless: the house voice for Promptless prose, published as a Vale package.
#
# Consumers point `Packages` at the zip that the promptless.ai release workflow
# attaches to the `vale` release, run `vale sync`, and get four styles:
#
#   Promptless  house terminology and sentence-case headings (this repo)
#   Voices      banned words, puffery, weasel words, weak verbs, recaps
#   Direct      no hedging, no preamble, sentences under 25 words
#   Moose       em dashes
#
# Voices, Direct, Moose, and Std are vendored from hawkeyexl/moose-vale (see
# NOTICE), so there is no nested package to fetch. Std is installed but not
# enabled: Direct.Length extends it, and consumers can enable Std rules.
#
# This file carries no file section on purpose: a consumer's own section for
# the same glob cannot narrow one shipped here, so each consumer chooses its
# scope and lists the styles it wants:
#
#   [*.{md,mdx}]
#   BasedOnStyles = Voices, Direct, Moose, Promptless
MinAlertLevel = suggestion

[formats]
mdx = md
