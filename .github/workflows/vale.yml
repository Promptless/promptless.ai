name: vale

on:
  pull_request:
    paths:
      - 'src/content/docs/**'
      - '.vale.ini'
      - 'vale/**'
      - '.github/workflows/vale.yml'
  push:
    branches:
      - main
    paths:
      - 'src/content/docs/**'
      - '.vale.ini'
      - 'vale/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The action runs `vale sync` first, which installs vale/Promptless into
      # the gitignored StylesPath. The whole docs tree is linted and any error
      # fails the run, so the published package is always clean against the
      # site that publishes it.
      - name: Run Vale
        uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          files: src/content/docs
          fail_on_error: true
          # Reviewdog's GitHub Check reporter returns a failing status for
          # warning annotations. CI blocks only on error-level Vale alerts;
          # warnings remain available from a local Vale run.
          filter: '.Level == "error"'
          filter_mode: nofilter
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
