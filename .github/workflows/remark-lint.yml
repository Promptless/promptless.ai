name: remark-lint

on:
  pull_request:
    paths:
      - "src/content/docs/**/*.md"
      - "src/content/docs/**/*.mdx"
      - ".remarkrc.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/remark-lint.yml"

# CI doesn't push remark's fixes: a push with GITHUB_TOKEN leaves the PR's
# follow-up check runs waiting for approval
# (https://docs.github.com/en/actions/concepts/security/github_token).
# Instead, `lint` fails and saves the diff remark wants, and `comment` posts it
# on the PR for the PR's owner to apply.
permissions:
  contents: read

concurrency:
  group: remark-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      fixes: ${{ steps.fixes.outputs.found }}
    steps:
      # Check out the PR head, not the merge commit, so the suggested diff
      # applies to the PR branch.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Guard: MDX-only syntax (import/export/JSX components) must live in `.mdx`
      # files, not `.md`. remark parses `.md` with the MDX parser here, but Astro
      # renders `.md` through the plain-Markdown pipeline — so autofixing MDX in a
      # `.md` file reindents lists and BREAKS rendering (see adrs/0005). This
      # blocks that class of mistake before the reformat can act on it.
      - name: Guard against MDX syntax in .md files
        run: |
          if grep -rlE '^import |^export |<[A-Z][A-Za-z]+' src/content/docs --include='*.md'; then
            echo "::error::.md files must not use MDX syntax (import/export/JSX components). Rename the file to .mdx."
            exit 1
          fi

      # remark's fix is a full reformat (remark-stringify), so this normalizes
      # structure and fixes auto-fixable rule violations in the working tree.
      - name: Auto-repair
        run: npm run lint:md:fix

      - name: Save suggested fixes
        id: fixes
        run: |
          git diff -- src/content/docs > remark-fixes.diff
          if [ -s remark-fixes.diff ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- src/content/docs
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload suggested fixes
        if: steps.fixes.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remark-fixes
          path: remark-fixes.diff
          retention-days: 7

      # --frail exits non-zero on any remaining lint message that the reformat
      # could not fix.
      - name: Block on remaining violations
        run: npm run lint:md

      - name: Fail on unapplied fixes
        if: steps.fixes.outputs.found == 'true'
        run: |
          echo "::error::remark-lint has formatting fixes for this PR. Apply the diff in the PR comment (or above in this log), or run 'npm run lint:md:fix' and commit the result."
          exit 1

  # Posts the suggested diff as one PR comment, edits it on later runs, and
  # deletes it once remark has nothing to fix. Fork PRs get a read-only token,
  # so they skip this job and rely on the lint job's log and error.
  comment:
    needs: lint
    if: >-
      always() &&
      needs.lint.outputs.fixes != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MARKER: "<!-- remark-lint-fixes -->"
    steps:
      - name: Download suggested fixes
        if: needs.lint.outputs.fixes == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: remark-fixes

      - name: Post, update, or delete the fixes comment
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n 1)

          if [ "${{ needs.lint.outputs.fixes }}" != "true" ]; then
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$existing"
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo "**remark-lint:** apply this diff to the PR branch and commit it (\`git apply\`), or run \`npm run lint:md:fix\` and commit the result. Generated for ${HEAD_SHA}."
            echo
            # GitHub caps comments at 65,536 characters.
            if [ "$(wc -c < remark-fixes.diff)" -gt 60000 ]; then
              echo "The diff is too large to post. It's in the remark-lint job log."
            else
              # Fence with more backticks than any run in the diff, since docs
              # contain code fences.
              longest=$(grep -o '`\+' remark-fixes.diff | awk '{ if (length > m) m = length } END { print m + 0 }')
              fence=$(printf '%*s' "$(( longest >= 3 ? longest + 1 : 3 ))" '' | tr ' ' '`')
              echo "${fence}diff"
              cat remark-fixes.diff
              echo "$fence"
            fi
          } > comment.md

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
