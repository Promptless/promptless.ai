# Structure template for the term pages in this directory, for `manni lint
# structure` (lint.types in manni.config.yaml). A term page is frontmatter
# only, so the template asks for no sections. `manni term check` and
# `manni meta validate` check its fields.
$schema: https://hawkeyexl.github.io/manni/schemas/lint/template/2.json
templates:
  term:
    types: [term]
