# "Reply obligation" is an internal concept, not user-facing terminology.
#
# The phrase names how Promptless tracks that it owes an answer on a ticket or
# thread. That is internal implementation vocabulary; in user-facing docs,
# describe the observable behavior instead — Promptless comments on the ticket
# (or thread) and flags it for follow-up if it goes unanswered.
#
# There is no clean one-word swap for the phrase (it must be reworded, not
# substituted), so this runs as an existence check that flags the phrase and
# points writers at the behavior to describe. The `\s+` between the two words
# absorbs any spacing, and the optional `s` catches the plural "reply
# obligations". Match is case-insensitive so sentence-initial uses are caught.
extends: existence
message: "Don't use the internal term '%s' in user-facing docs; describe the behavior instead (Promptless comments on the ticket/thread and flags it for follow-up if it goes unanswered)."
level: error
ignorecase: true
tokens:
  - '\breply\s+obligations?\b'
