# External metadata for the docs pages in src/content/docs, keyed by each
# page's `id` frontmatter field (see manni.config.yaml). It holds the fields the
# manni vocabularies mark `x-manni-location: external`: maintainer-facing
# metadata that page frontmatter, and the agents that read it, don't need.
#
# - owner, created: stamped by `npx manni meta derive` from CODEOWNERS and git;
#   CI fails when a stamp is stale. Don't edit them by hand.
# - personas, journeys: ids from the Promptless content strategy.
# - meta-provenance: metadata a machine proposed and no human has reviewed yet.
#   Delete a page's meta-provenance once you've reviewed its fields.
