# The docs site dogfoods the Vale package it publishes. `vale sync` installs
# the package into .vale/styles (gitignored); the package's own .vale.ini
# supplies the styles and the mdx format mapping.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = ./vale/Promptless

# Only docs pages are held to the house styles: blog, changelog, and marketing
# pages keep their own conventions (title-case headings, longer sentences).
#
# Frontmatter coverage: Vale exposes each top-level frontmatter key as a
# `text.frontmatter.<key>` scope. Promptless.Headings scopes to `heading` plus
# `text.frontmatter.title`, so the page `title`, which Starlight renders as
# the H1, is held to the same sentence-case rule as in-body headings. The
# `description` key is prose and is left to paragraph-level rules. The nested
# `sidebar.label` key cannot be individually scoped, so it is not linted;
# `title` already governs the H1 casing that drives the nav label for pages
# without an override.
#
# Terms is the style `manni term write -f vale` generates from the term pages
# in terms/ (committed under .vale/styles/Terms; never edit it by hand). On docs
# pages its casing rules run as warnings, not the generated errors: Vale also
# lints frontmatter values such as `id` and `slug`, domains such as gitlab.com,
# and link targets inside MDX components, so lowercase identifiers like
# `for-docs-connect-triggers-jira` would fail CI. See terms/README.md.
[src/content/docs/**/*.{md,mdx}]
BasedOnStyles = Voices, Direct, Moose, Promptless, Terms
Terms.Casing = warning
Terms.Lowercase = warning
Terms.SentenceStart = warning

# Term definitions (terms/). `manni term lint` writes each term's definition,
# abstract, and scope note to a temporary `<id>.<field>.md` file and runs Vale
# over them with this configuration, so they meet the docs pages' house voice.
[*.{definition,abstract,scope-note}.md]
BasedOnStyles = Voices, Direct, Moose, Promptless, Terms
